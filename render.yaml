# Render Blueprint: New → Blueprint → select this repo.
services:
  - type: web
    name: lablink
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PERSISTENCE
        value: memory
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
